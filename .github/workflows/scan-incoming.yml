name: Scan Incoming Folder

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Detect new videos
        run: python pipeline/scan.py

      - name: Commit queue updates
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add queue.json
          git diff --cached --quiet || git commit -m "scan: detect new videos"
          git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git
