name: Process Video Pipeline

on:
  workflow_dispatch:
    inputs:
      video_filename:
        description: 'Video filename from queue.json'
        required: true
        type: string

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python deps
        run: pip install --no-cache-dir -r requirements.txt

      - name: Download video from R2 if needed
        run: |
          python -c "
          import json, urllib.request, os
          with open('queue.json') as f:
              queue = json.load(f)
          filename = '${{ github.event.inputs.video_filename }}'
          video = next((v for v in queue['videos'] if v['filename'] == filename), None)
          if video and video.get('source_url'):
              print(f'Downloading from R2: {video["source_url"]}')
              os.makedirs('incoming', exist_ok=True)
              urllib.request.urlretrieve(video['source_url'], f'incoming/{filename}')
              print('Download complete')
          elif not os.path.exists(f'incoming/{filename}'):
              print(f'Video not found in incoming/ and no source_url')
              exit(1)
          else:
              print(f'Using local file: incoming/{filename}')
          "

      - name: Run pipeline
        run: |
          python pipeline/render.py \
            --input "incoming/${{ github.event.inputs.video_filename }}" \
            --output-dir processed

      - name: Update queue
        run: |
          python pipeline/update_queue.py \
            --video "${{ github.event.inputs.video_filename }}" \
            --status completed

      - name: Commit and push results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add processed/ queue.json incoming/
          git diff --cached --quiet || git commit -m "pipeline: process ${{ github.event.inputs.video_filename }}"
          git pull --rebase https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git || true
          git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git
